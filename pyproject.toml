[project]
name = "django-model-import"
version = "0.8.0"
description = "A Django library for importing CSVs and other structured data quickly using Django's ModelForm for validation and deserialisation into an instance."
authors = [{ name = "Aidan Lister", email = "aidan@uptickhq.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "python-dateutil>=2.9.0,<3",
    "tablib>=3.3.0,<4",
    "django>=3.2.0,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/uptick/django-model-import"
Repository = "https://github.com/uptick/django-model-import"
Documentation = "https://github.com/uptick/django-model-import/tree/master/tests/djangoexample"

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "pytest-django==4.12.0",
    "ruff==0.15.17",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["djangomodelimport"]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "django",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
django = ["django"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

